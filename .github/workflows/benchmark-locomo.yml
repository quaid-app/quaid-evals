name: Benchmark - LoCoMo

on:
  repository_dispatch:
    types: [quaid-released]
  workflow_dispatch:
    inputs:
      quaid_version:
        description: 'Quaid version to test (e.g. v1.0.0 or "latest")'
        required: false
        default: 'latest'
      locomo_max_questions:
        description: 'LoCoMo max questions (default: 50 for regular runs; leave blank for full set)'
        required: false
        default: '50'

concurrency:
  group: benchmark-locomo-${{ github.event.client_payload.version || inputs.quaid_version || github.run_id }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.benchmarks == null || github.event.client_payload.benchmarks == '' || contains(github.event.client_payload.benchmarks, 'locomo')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Quaid
        run: bash scripts/install-quaid.sh "${{ github.event.client_payload.version || inputs.quaid_version || 'latest' }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run LoCoMo benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_QUESTIONS: ${{ github.event.client_payload.locomo_max_questions || inputs.locomo_max_questions || '50' }}
        run: bash benchmarks/locomo/run.sh

      - name: Generate report snapshot
        if: always()
        run: python scripts/generate-report.py

      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-locomo
          path: |
            results/locomo-*.json
            site/src/data/report.json
          if-no-files-found: warn
          retention-days: 30
