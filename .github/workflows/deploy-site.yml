name: Publish Benchmark Dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Benchmark - DAB
      - Benchmark - gbrain-evals
      - Benchmark - LoCoMo
      - Benchmark - LongMemEval
      - Benchmark - BEAM
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/generate-report.py'
      - 'scripts/collect-benchmark-artifacts.py'

concurrency:
  group: publish-benchmark-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Collect latest benchmark artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/collect-benchmark-artifacts.py

      - name: Generate report
        run: python scripts/generate-report.py

      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "benchmark: publish latest dashboard results [skip ci]"
          file_pattern: 'results/*.json site/src/data/*.json'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Add CNAME
        run: echo "benchmark.quaid.app" > site/dist/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/dist
          force_orphan: false
