name: Benchmark - BEAM

on:
  repository_dispatch:
    types: [quaid-released]
  workflow_dispatch:
    inputs:
      quaid_version:
        description: 'Quaid version to test (e.g. v1.0.0 or "latest")'
        required: false
        default: 'latest'
      beam_split:
        description: 'BEAM split to run (100K, 500K, 1M, 10M)'
        required: false
        default: '100K'
      beam_max_conversations:
        description: 'BEAM max conversations (3 for CI smoke; use all for full split)'
        required: false
        default: '3'

concurrency:
  group: benchmark-beam-${{ github.event.client_payload.version || inputs.quaid_version || github.run_id }}
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.benchmarks == null || github.event.client_payload.benchmarks == '' || contains(github.event.client_payload.benchmarks, 'beam')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Quaid
        run: bash scripts/install-quaid.sh "${{ github.event.client_payload.version || inputs.quaid_version || 'latest' }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run BEAM benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEAM_SPLIT: ${{ github.event.client_payload.beam_split || inputs.beam_split || '100K' }}
          MAX_CONVERSATIONS: ${{ github.event.client_payload.beam_max_conversations || inputs.beam_max_conversations || '3' }}
        run: bash benchmarks/beam/run.sh

      - name: Generate report snapshot
        if: always()
        run: python scripts/generate-report.py

      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-beam
          path: |
            results/beam-*.json
            site/src/data/report.json
          if-no-files-found: warn
          retention-days: 30
